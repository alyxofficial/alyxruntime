<!doctype html>
<html lang=en>
<head>
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>alyxruntime</title>
<style>
:root{--bg:#fff;--panel:#f5f6f8;--fg:#1d2330;--mut:#667085;--bd:#e1e4ea;--code:#f8f9fb;--hov:#eceef2;--pri:#3b5bdb;--err:#c92a2a;--warn:#d9822b;--ok:#2f9e44;--sel:#3b5bdb33;--k:#8e44ad;--s:#2b8a3e;--n:#d9480f;--c:#868e96;--f:#1c64c4;--b:#0b7285;--d:#a8741a;
--a0:#1d2330;--a1:#c92a2a;--a2:#2b8a3e;--a3:#a8741a;--a4:#1c64c4;--a5:#9c36b5;--a6:#0b7285;--a7:#868e96;--a8:#495057;--a9:#e03131;--a10:#37b24d;--a11:#c99400;--a12:#339af0;--a13:#be4bdb;--a14:#15aabf;--a15:#adb5bd;
--mono:"JetBrains Mono","Roboto Mono","SF Mono",ui-monospace,Consolas,monospace}
body.dark{--bg:#14161b;--panel:#1a1d24;--fg:#e4e7ee;--mut:#8b93a4;--bd:#2a2f3a;--code:#181b21;--hov:#242832;--pri:#8fa8ff;--err:#ff8787;--warn:#ffa94d;--ok:#69db7c;--sel:#8fa8ff40;--k:#c792ea;--s:#a5d6a7;--n:#ffab70;--c:#6b7385;--f:#82aaff;--b:#7fdbca;--d:#e5c07b;
--a0:#4b5263;--a1:#ff6b6b;--a2:#69db7c;--a3:#ffd43b;--a4:#74a7ff;--a5:#da77f2;--a6:#66d9e8;--a7:#ced4da;--a8:#6b7385;--a9:#ff8787;--a10:#8ce99a;--a11:#ffe066;--a12:#a5d8ff;--a13:#e599f7;--a14:#99e9f2;--a15:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;height:100vh;display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;border-radius:6px;padding:4px 9px}
button:hover{background:var(--hov)}
:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
header{padding:8px 14px 0;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--bd)}
.logo{width:34px;height:34px;border-radius:9px;background:var(--pri);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:19px;margin-bottom:8px}
.hd{display:flex;flex-direction:column}
#title{font:600 16px Inter,system-ui,sans-serif;border:0;background:none;color:var(--fg);width:280px;padding:2px 6px;border-radius:6px}
#title:hover,#title:focus{background:var(--hov);outline:0}
.menus{display:flex}.m{position:relative}
.m>span{padding:3px 9px;display:block;cursor:default;border-radius:6px;color:var(--mut)}
.m:hover>span{background:var(--hov);color:var(--fg)}
.dd{display:none;position:absolute;top:100%;left:0;background:var(--bg);border:1px solid var(--bd);border-radius:8px;box-shadow:0 6px 24px #0003;min-width:230px;z-index:9;padding:4px}
.m:hover .dd{display:block}
.dd button{display:block;width:100%;text-align:left;padding:6px 12px}
#conn{margin-left:auto;margin-bottom:8px;border:1px solid var(--bd);border-radius:18px;padding:5px 14px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:7px}
.bar{padding:6px 14px;display:flex;gap:6px;border-bottom:1px solid var(--bd);background:var(--panel)}
.bar button{border:1px solid var(--bd);background:var(--bg)}
.wrap{flex:1;display:flex;min-height:0}
aside{width:260px;border-right:1px solid var(--bd);overflow:auto;padding:10px;background:var(--panel)}
aside[hidden]{display:none}
aside li{list-style:none;padding:5px 8px;cursor:pointer;border-radius:6px}
aside li:hover{background:var(--hov)}aside ul{margin:8px 0;padding:0}
#nb{flex:1;overflow:auto;padding:20px 24px 240px}
.cell{max-width:1000px;margin:0 auto 14px;position:relative}
.row{display:flex;gap:8px;align-items:flex-start}
.gut{width:64px;flex:none;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mut);font:11px var(--mono);padding-top:4px}
.dur{min-height:14px}
.play{width:34px;height:34px;border-radius:50%;background:var(--hov);position:relative;padding:0;font-size:13px}
.play:hover{background:var(--pri);color:var(--bg)}
.queued .play{opacity:.55}
.run .play{background:var(--pri);color:var(--bg)}
.run .play::before{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid transparent;border-top-color:var(--pri);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fail .n{color:var(--err)}
.ed{flex:1;border:1px solid var(--bd);border-radius:8px;background:var(--code);min-width:0;position:relative;overflow:hidden}
.cell:focus-within .ed{border-color:var(--pri)}
.run .ed::after{content:"";position:absolute;left:0;bottom:0;height:2px;width:30%;background:var(--pri);animation:slide 1.1s ease-in-out infinite}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(340%)}}
.cm{position:relative}
.hl,textarea{font:13px/1.6 var(--mono);padding:10px 14px;margin:0;white-space:pre-wrap;word-break:break-word;tab-size:4}
.hl{position:absolute;inset:0;pointer-events:none;overflow:hidden}
textarea{position:relative;width:100%;border:0;background:none;color:var(--fg);resize:none;outline:0;display:block;overflow:hidden}
.code textarea{color:transparent;caret-color:var(--fg)}
textarea::selection{background:var(--sel)}
.hl i,.cb i{font-style:normal}
.k{color:var(--k)}.s{color:var(--s)}.n{color:var(--n)}.c{color:var(--c)}.f{color:var(--f)}.b{color:var(--b)}.hl .m{color:var(--warn)}.d{color:var(--d)}
.text .ed{background:none;border-color:transparent}
.text:focus-within .ed,.text .ed:has(textarea:not([hidden])){border-color:var(--pri);background:var(--code)}
.md{padding:2px 8px;line-height:1.65}
.md h1{font-size:28px;margin:.4em 0 .3em}.md h2{font-size:22px;margin:.4em 0 .3em}.md h3{font-size:17px;margin:.4em 0 .2em}.md p{margin:.3em 0}
.md code{background:var(--hov);padding:1px 5px;border-radius:4px;font:12.5px var(--mono)}
.md pre.cb{background:var(--code);border:1px solid var(--bd);border-radius:8px;padding:10px 14px;font:12.5px/1.55 var(--mono);overflow:auto}
.md blockquote{margin:.4em 0;padding:2px 12px;border-left:3px solid var(--bd);color:var(--mut)}
.md a{color:var(--pri)}
.tools{display:flex;visibility:hidden}
.cell:hover .tools,.cell:focus-within .tools{visibility:visible}
.out{display:none;position:relative;margin:6px 0 0 72px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);max-height:520px;overflow:auto}
.out.has{display:block}.out .oc{padding:2px 0}
.clr{position:sticky;float:right;top:4px;right:4px;margin:4px;z-index:2;font-size:12px;color:var(--mut);background:var(--panel);border:1px solid var(--bd);visibility:hidden}
.out:hover .clr{visibility:visible}
.out pre{margin:0;padding:8px 14px;white-space:pre-wrap;word-break:break-word;font:12.5px/1.5 var(--mono)}
.out pre+pre{border-top:1px dashed var(--bd)}
.out .stderr{background:color-mix(in srgb,var(--warn) 8%,transparent);box-shadow:inset 3px 0 var(--warn)}
.out .error{background:color-mix(in srgb,var(--err) 9%,transparent);box-shadow:inset 3px 0 var(--err)}
.out .result{box-shadow:inset 3px 0 var(--pri)}
.pb{display:inline-block;vertical-align:middle;width:min(240px,38vw);height:.85em;margin:0 .5em 0 .2em;background:var(--bd);border-radius:99px;position:relative;overflow:hidden}
.pb i{position:absolute;inset:0 auto 0 0;background:var(--pri);border-radius:inherit}
.pb.full i{background:var(--ok)}
.fig{position:relative;padding:10px 14px}
.fig img{max-width:100%;height:auto;border-radius:6px;background:#fff;cursor:zoom-in;display:block}
.fig.zoom img{max-width:none;cursor:zoom-out}.fig.zoom{overflow:auto}
.fig a{position:absolute;top:16px;right:20px;background:var(--panel);border:1px solid var(--bd);border-radius:6px;padding:2px 8px;font-size:12px;color:var(--fg);text-decoration:none;visibility:hidden}
.fig:hover a{visibility:visible}
dialog{border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--fg);width:460px;max-width:94vw;padding:20px}
dialog::backdrop{background:#0007}
dialog input[type=text],dialog input[type=password]{width:100%;padding:8px 10px;margin:4px 0 12px;background:var(--code);color:var(--fg);border:1px solid var(--bd);border-radius:6px}
dialog small{display:block;color:var(--mut);margin-bottom:10px}
.pri{background:var(--pri);color:var(--bg)}.pri:hover{background:var(--pri);opacity:.9}
#err{color:var(--err);margin:8px 0;white-space:pre-wrap}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}
@media(max-width:700px){.out{margin-left:0}.gut{width:44px}#title{width:160px}}
</style>
</head>
<body>
<header>
  <div class=logo><img src="images/alyx.png"></div>
  <div class=hd>
    <input id=title value="Untitled.ipynb" aria-label="Notebook name">
    <nav class=menus>
      <div class=m><span>File</span><div class=dd>
        <button onclick="$('#of').click()">Open notebook…</button>
        <button onclick=dl()>Download .ipynb</button>
        <button onclick=dlpy()>Download .py</button>
        <button onclick="if(confirm('Clear notebook?')){cells=[];add('code')}">New notebook</button>
      </div></div>
      <div class=m><span>Runtime</span><div class=dd>
        <button onclick=runAll()>Run all</button>
        <button onclick=intr()>Interrupt execution</button>
        <button onclick=restart()>Restart runtime</button>
        <button onclick="restart().then(runAll)">Restart and run all</button>
        <button onclick="$('#dlg').showModal()">Change connection…</button>
      </div></div>
      <div class=m><span>View</span><div class=dd>
        <button onclick="$('#files').hidden^=1;ls(cwd)">Toggle files</button>
        <button onclick=theme()>Toggle dark mode</button>
        <button onclick="cells.forEach(c=>clearOut(c));save()">Clear all outputs</button>
      </div></div>
    </nav>
  </div>
  <button id=conn onclick="$('#dlg').showModal()">Connect</button>
</header>
<div class=bar>
  <button onclick="add('code')">+ Code</button>
  <button onclick="add('text')">+ Text</button>
  <button onclick=runAll()>▶ Run all</button>
  <button onclick=intr()>■ Interrupt</button>
  <button onclick="$('#files').hidden^=1;ls(cwd)">Files</button>
</div>
<div class=wrap>
  <aside id=files hidden>
    <b>Files</b> <button onclick="$('#up').click()">Upload</button>
    <ul id=fl></ul>
    <input id=up type=file multiple hidden>
  </aside>
  <div id=nb></div>
</div>
<input id=of type=file accept=.ipynb hidden>
<dialog id=dlg>
  <form method=dialog onsubmit="return false">
    <h3 style="margin-top:0">Connect to runtime</h3>
    URL
    <input type=text id=cu placeholder="https://xxxx.trycloudflare.com/?token=…">
    Token (if not in the URL)
    <input type=password id=ct>
    <small>The browser talks directly to the runtime, so the host must allow this page’s origin (CORS) and be reachable over HTTPS when this page is served over HTTPS.</small>
    <div id=err></div>
    <div style="text-align:right">
      <button onclick="$('#dlg').close()">Cancel</button>
      <button class=pri onclick=conn()>Connect</button>
    </div>
  </form>
</dialog>

<script>
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let cells=[],q=Promise.resolve(),abort=false,all=false,cwd='',rt=null,info=null;

/* ---------- Jupyter client (browser, no server) ---------- */
const splitUrl=u=>{
  if(!/^[a-z]+:\/\//i.test(u))u='https://'+u;
  const p=new URL(u);
  let base=p.origin+p.pathname.replace(/\/$/,'');
  base=base.replace(/\/(lab|tree|api)$/,'');
  return[base,p.searchParams.get('token')];
};
class Runtime{
  constructor(url,token,kid){const[b,t]=splitUrl(url);this.base=b;this.token=token||t||'';this.kid=kid||null}
  async api(method,path,body,params){
    const u=new URL(this.base+path);
    for(const k in params||{})u.searchParams.set(k,params[k]);
    let r;
    try{
      r=await fetch(u,{method,redirect:'manual',headers:{...(this.token?{Authorization:'token '+this.token}:{}),...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});
    }catch(e){
      throw new Error('Cannot reach '+this.base+'.\nIf the host is up, it must allow this origin (CORS): start Jupyter with --ServerApp.allow_origin="*" or the origin of this page.')
    }
    if(r.type=='opaqueredirect'||[301,302,401,403].includes(r.status))throw new Error('Access denied (HTTP '+(r.status||'redirect')+'). Check the token and the host’s allowed IPs.');
    if([502,503,504,530].includes(r.status))throw new Error('Tunnel/host not ready (HTTP '+r.status+'). Is the runtime still running?');
    if(r.status>=400)throw new Error(method+' '+path+' → HTTP '+r.status+': '+(await r.text()).slice(0,200));
    return r.status==204?null:r.json().catch(()=>null);
  }
  async wait(ms=20000){
    const end=Date.now()+ms;
    for(;;){try{return await this.api('GET','/api/status')}catch(e){if(!/not ready/.test(e.message)||Date.now()>end)throw e;await new Promise(r=>setTimeout(r,2000))}}
  }
  async kernel(){
    if(this.kid){try{await this.api('GET','/api/kernels/'+this.kid);return this.kid}catch(e){this.kid=null}}
    this.kid=(await this.api('POST','/api/kernels',{name:'python3'})).id;
    return this.kid;
  }
  async restart(){await this.api('POST','/api/kernels/'+await this.kernel()+'/restart')}
  async interrupt(){if(this.kid)await this.api('POST','/api/kernels/'+this.kid+'/interrupt')}
  run(code,emit){
    return new Promise(async(res,rej)=>{
      let id;try{id=await this.kernel()}catch(e){return rej(e)}
      const ws=new WebSocket(this.base.replace(/^http/,'ws')+'/api/kernels/'+id+'/channels'+(this.token?'?token='+encodeURIComponent(this.token):''));
      const mid=crypto.randomUUID().replace(/-/g,'');
      let idle=0,rep=0,ok=1,n=null,done=0;
      const fin=()=>{if(idle&&rep){done=1;ws.close();res({ok:!!ok,n})}};
      ws.onopen=()=>ws.send(JSON.stringify({header:{msg_id:mid,username:'alyx',session:crypto.randomUUID().replace(/-/g,''),msg_type:'execute_request',version:'5.3',date:new Date().toISOString()},parent_header:{},metadata:{},buffers:[],channel:'shell',content:{code,silent:false,store_history:true,user_expressions:{},allow_stdin:false,stop_on_error:true}}));
      ws.onmessage=e=>{
        const m=JSON.parse(e.data);
        if((m.parent_header||{}).msg_id!=mid)return;
        const k=m.msg_type||m.header.msg_type,c=m.content;
        if(k=='stream')emit(c.name=='stderr'?'stderr':'stdout',c.text);
        else if(k=='execute_result'||k=='display_data'){
          const d=c.data||{};
          const png=d['image/png']||d['image/jpeg'];
          if(png)emit('img',png.replace(/\s/g,''));
          else if(d['image/svg+xml'])emit('img',btoa(unescape(encodeURIComponent(d['image/svg+xml']))));
          else if(d['text/plain'])emit('result',d['text/plain']+'\n');
        }else if(k=='error')emit('error',c.traceback.join('\n')+'\n');
        else if(k=='status'&&c.execution_state=='idle'){idle=1;fin()}
        else if(k=='execute_reply'){rep=1;ok=c.status=='ok';n=c.execution_count;fin()}
      };
      ws.onerror=()=>{if(!done){done=1;rej(new Error('WebSocket connection failed. Check the token and the host’s origin settings.'))}};
      ws.onclose=()=>{if(!done){done=1;rej(new Error('Connection to the runtime was lost.'))}};
    });
  }
  async exec(code){let o='';await this.run(code,(t,x)=>{if(t=='stdout')o+=x});return o}
  async hw(){
    const py=`import json,os,subprocess
g=[]
try:
    for l in subprocess.check_output(['nvidia-smi','--query-gpu=index,name,memory.total','--format=csv,noheader'],text=True).strip().splitlines():
        i,n,m=[x.strip() for x in l.split(',')];g.append({'index':i,'name':n,'memory':m})
except Exception:pass
try:r=round(os.sysconf('SC_PAGE_SIZE')*os.sysconf('SC_PHYS_PAGES')/2**30,1)
except Exception:r=0
print(json.dumps({'cpu_count':os.cpu_count(),'ram_gb':r,'gpus':g}))`;
    return JSON.parse((await this.exec(py)).trim().split('\n').pop());
  }
  files(p){return this.api('GET','/api/contents/'+p.split('/').filter(Boolean).map(encodeURIComponent).join('/'))}
  async upload(path,file){
    const b=await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result.split(',')[1]);f.readAsDataURL(file)});
    return this.api('PUT','/api/contents/'+path.split('/').map(encodeURIComponent).join('/'),{type:'file',format:'base64',content:b});
  }
  async download(path){
    const r=await this.api('GET','/api/contents/'+path.split('/').map(encodeURIComponent).join('/'),null,{content:1,format:'base64',type:'file'});
    return new Blob([Uint8Array.from(atob(r.content),c=>c.charCodeAt(0))]);
  }
}

/* ---------- state ---------- */
const dark=localStorage.alyx_dark;
if(dark?dark=='1':matchMedia('(prefers-color-scheme: dark)').matches)document.body.classList.add('dark');
const theme=()=>localStorage.alyx_dark=document.body.classList.toggle('dark')?'1':'0';
const save=()=>{
  const d=strip=>JSON.stringify({t:$('#title').value,c:cells.map(c=>({type:c.type,src:c.src,n:c.n,dur:c.dur,outs:strip?c.outs.filter(o=>o.t!='img'):c.outs}))});
  try{localStorage.alyx_nb=d(0)}catch(e){try{localStorage.alyx_nb=d(1)}catch(e){}}
};
$('#title').oninput=save;
const fit=t=>{t.style.height='auto';t.style.height=t.scrollHeight+'px'};
const fmt=s=>s<60?s.toFixed(1)+'s':Math.floor(s/60)+'m '+Math.round(s%60)+'s';

/* ---------- Python highlighting ---------- */
const KW=new Set('and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield match case'.split(' '));
const BI=new Set('print len range int str float list dict set tuple bool type isinstance open enumerate zip map filter sum min max abs sorted reversed any all super self cls input iter next round repr format getattr setattr hasattr'.split(' '));
const CO=new Set(['True','False','None']);
const TOK=/(#.*)|("""[\s\S]*?(?:"""|$)|'''[\s\S]*?(?:'''|$)|(?:[rbfuRBFU]{1,2})?"(?:\\.|[^"\\\n])*"?|(?:[rbfuRBFU]{1,2})?'(?:\\.|[^'\\\n])*'?)|(^[ \t]*[!%].*)|(@[\w.]+)|(\b0[xX][\da-fA-F]+\b|\b\d[\d_]*(?:\.\d*)?(?:[eE][+-]?\d+)?\b)|([A-Za-z_]\w*)/gm;
function hi(s){
  let o='',l=0,prev='',m;TOK.lastIndex=0;
  while(m=TOK.exec(s)){
    if(m.index>l)o+=esc(s.slice(l,m.index));
    l=TOK.lastIndex;const w=m[0];
    const k=m[1]?'c':m[2]?'s':m[3]?'m':m[4]?'d':m[5]?'n':KW.has(w)?'k':CO.has(w)?'n':BI.has(w)?'b':(prev=='def'||prev=='class'||s[l]=='(')?'f':'';
    o+=k?`<i class=${k}>${esc(w)}</i>`:esc(w);prev=m[6]?w:'';
  }
  return o+esc(s.slice(l));
}

/* ---------- Markdown ---------- */
const inl=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>').replace(/\[(.+?)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target=_blank rel=noopener>$1</a>');
function md(s){
  const L=s.split('\n');let o='',i=0,list='';
  const close=()=>{if(list){o+=`</${list}>`;list=''}};
  while(i<L.length){
    const l=L[i++];let m;
    if(/^```/.test(l)){close();const b=[];while(i<L.length&&!/^```/.test(L[i]))b.push(L[i++]);i++;o+=`<pre class=cb>${hi(b.join('\n'))}</pre>`;continue}
    if(m=l.match(/^(#{1,4}) (.*)/)){close();o+=`<h${m[1].length}>${inl(m[2])}</h${m[1].length}>`}
    else if(m=l.match(/^\s*([-*]|\d+\.) (.*)/)){const t=/\d/.test(m[1])?'ol':'ul';if(list!=t){close();o+=`<${t}>`;list=t}o+=`<li>${inl(m[2])}</li>`}
    else if(/^---+$/.test(l)){close();o+='<hr>'}
    else if(m=l.match(/^> ?(.*)/)){close();o+=`<blockquote>${inl(m[1])}</blockquote>`}
    else if(!l.trim())close();
    else{close();o+=`<p>${inl(l)}</p>`}
  }
  close();return o;
}

/* ---------- Terminal output ---------- */
function c256(n){
  if(n<16)return`var(--a${n})`;
  if(n<232){n-=16;const f=v=>v?v*40+55:0;return`rgb(${f(n/36|0)},${f(n/6%6|0)},${f(n%6)})`}
  const g=(n-232)*10+8;return`rgb(${g},${g},${g})`;
}
function sgr(st,cs){
  for(let i=0;i<cs.length;i++){
    const c=cs[i];
    if(c==0)for(const k in st)delete st[k];
    else if(c==1)st.b=1;else if(c==2)st.d=1;else if(c==3)st.i=1;else if(c==4)st.u=1;
    else if(c==22){delete st.b;delete st.d}else if(c==23)delete st.i;else if(c==24)delete st.u;
    else if(c>=30&&c<=37)st.fg=c256(c-30);else if(c>=90&&c<=97)st.fg=c256(c-82);else if(c==39)delete st.fg;
    else if(c>=40&&c<=47)st.bg=c256(c-40);else if(c>=100&&c<=107)st.bg=c256(c-92);else if(c==49)delete st.bg;
    else if(c==38||c==48){
      const k=c==38?'fg':'bg';
      if(cs[i+1]==5){st[k]=c256(cs[i+2]);i+=2}
      else if(cs[i+1]==2){st[k]=`rgb(${cs[i+2]},${cs[i+3]},${cs[i+4]})`;i+=4}
    }
  }
}
function ansi(t,st){
  let o='',last=0,m;
  const re=/\x1b\[([0-9;?]*)([A-Za-z])|\x1b[\]()][^\x07\x1b]*\x07?/g;
  const span=s=>{
    if(!s)return'';
    const css=(st.fg?'color:'+st.fg+';':'')+(st.bg?'background:'+st.bg+';':'')+(st.b?'font-weight:700;':'')+(st.d?'opacity:.7;':'')+(st.i?'font-style:italic;':'')+(st.u?'text-decoration:underline;':'');
    return css?`<span style="${css}">${esc(s)}</span>`:esc(s);
  };
  while(m=re.exec(t)){o+=span(t.slice(last,m.index));last=re.lastIndex;if(m[2]=='m')sgr(st,m[1]?m[1].split(';').map(Number):[0])}
  return o+span(t.slice(last));
}
const bars=t=>t
  .replace(/(\d{1,3})%\|[^|\n]*\|/g,(_,p)=>`\uE000${Math.min(+p,100)}\uE001`)
  .replace(/\[([=>.]{10,})\]/g,(_,b)=>`\uE000${Math.round(100*(b.match(/[=>]/g)||[]).length/b.length)}\uE001`);
const barHtml=(_,p)=>`<span class="pb${p>=100?' full':''}"><i style="width:${p}%"></i></span>${p}%`;
const lineHtml=(t,st)=>ansi(bars(t),st).replace(/\uE000(\d+)\uE001/g,barHtml);
function feed(b,x){
  for(const p of x.split(/(\r\n|\n|\r)/)){
    if(p=='\n'||p=='\r\n'){b.h+=lineHtml(b.cur,b.st)+'\n';b.cur='';b.cr=0}
    else if(p=='\r')b.cr=1;
    else if(p){if(b.cr){b.cur='';b.cr=0}b.cur+=p}
  }
}
function paint(pre){
  const b=pre._b;if(b.raf)return;
  b.raf=requestAnimationFrame(()=>{b.raf=0;pre.innerHTML=b.h+lineHtml(b.cur,{...b.st})});
}

/* ---------- Outputs ---------- */
const mime=b=>b.startsWith('/9j/')?'jpeg':b.startsWith('R0lG')?'gif':b.startsWith('UklG')?'webp':(b.startsWith('PHN2')||b.startsWith('PD94'))?'svg+xml':'png';
function put(c,t,x,rec=true){
  const o=c.el.querySelector('.out'),oc=o.querySelector('.oc');
  o.classList.add('has');
  const stick=o.scrollTop+o.clientHeight>=o.scrollHeight-40;
  let l=oc.lastElementChild;
  if(t=='img'){
    const src=`data:image/${mime(x)};base64,${x}`;
    l=document.createElement('div');l.className='fig';
    l.innerHTML=`<img alt="Output image"><a download="output.${mime(x).split('+')[0]}" title="Save image">Save</a>`;
    const im=l.firstChild;
    im.onerror=()=>{l.textContent='This image could not be displayed.'};
    im.onclick=()=>l.classList.toggle('zoom');
    im.src=l.lastChild.href=src;oc.appendChild(l);
  }else{
    if(!l||l.tagName!='PRE'||l.className!=t){
      l=document.createElement('pre');l.className=t;l._b={h:'',cur:'',cr:0,st:{},raf:0};oc.appendChild(l);
    }
    feed(l._b,x);paint(l);
  }
  if(stick)requestAnimationFrame(()=>o.scrollTop=o.scrollHeight);
  if(rec){
    const p=c.outs[c.outs.length-1];
    if(p&&p.t==t&&t!='img')p.x=(p.x+x).slice(-1e5);else c.outs.push({t,x});
  }
}
function clearOut(c){c.outs=[];const o=c.el.querySelector('.out');o.querySelector('.oc').innerHTML='';o.classList.remove('has')}

/* ---------- Cells ---------- */
function mk(c){
  const d=c.el=document.createElement('div'),code=c.type=='code';
  d.className='cell '+c.type;
  d.innerHTML=`<div class=row><div class=gut>${code?'<button class=play title="Run (Shift+Enter)">▶</button><div class=n></div><div class=dur></div>':''}</div><div class=ed><div class=cm>${code?'<pre class=hl aria-hidden=true></pre>':''}<textarea spellcheck=false rows=1 aria-label="${code?'Code':'Text'} cell"></textarea></div>${code?'':'<div class=md></div>'}</div><div class=tools><button data-a=-1 title="Move up">↑</button><button data-a=1 title="Move down">↓</button><button data-a=x title="Delete cell">✕</button></div></div><div class=out><button class=clr title="Clear output">Clear</button><div class=oc></div></div>`;
  const t=c.t=d.querySelector('textarea'),h=d.querySelector('.hl'),m=d.querySelector('.md');
  t.value=c.src;
  const sync=()=>{if(h)h.innerHTML=hi(t.value)+'\n'};sync();
  const view=()=>{if(m){m.innerHTML=md(c.src);m.hidden=false;t.hidden=true}};
  const edit=()=>{if(m){m.hidden=true;t.hidden=false}t.focus();fit(t)};
  if(m){m.ondblclick=edit;c.src?view():(m.hidden=true)}
  t.oninput=()=>{c.src=t.value;fit(t);sync();save()};
  t.onkeydown=e=>{
    if(e.key=='Tab'){e.preventDefault();document.execCommand('insertText',false,'    ')}
    else if(e.key=='Enter'&&(e.shiftKey||e.ctrlKey)){
      e.preventDefault();code?run(c):view();
      if(e.shiftKey){const n=cells[cells.indexOf(c)+1];n?n.t.focus():add('code')}
    }else if(e.key=='Enter'&&code&&!e.altKey&&!e.metaKey){
      const ln=t.value.slice(0,t.selectionStart).split('\n').pop();
      let ind=ln.match(/^\s*/)[0];if(/:\s*$/.test(ln))ind+='    ';
      e.preventDefault();document.execCommand('insertText',false,'\n'+ind);
    }
  };
  if(code)d.querySelector('.play').onclick=()=>d.classList.contains('run')?intr():run(c);
  d.querySelector('.clr').onclick=()=>{clearOut(c);save()};
  d.querySelector('.tools').onclick=e=>{
    const a=e.target.dataset.a;if(!a)return;
    const i=cells.indexOf(c);
    if(a=='x')cells.splice(i,1);
    else{const j=i+ +a;if(j<0||j>=cells.length)return;cells.splice(i,1);cells.splice(j,0,c)}
    render();save();
  };
  c.outs.forEach(o=>put(c,o.t,o.x,false));
  if(c.n)d.querySelector('.n').textContent='['+c.n+']';
  if(c.dur&&code)d.querySelector('.dur').textContent=fmt(c.dur);
  setTimeout(()=>fit(t),0);
  return c;
}
const render=()=>$('#nb').replaceChildren(...cells.map(c=>c.el));
function add(type,src='',outs=[],n=0){
  const c=mk({type,src,outs,n});cells.push(c);render();fit(c.t);
  if(!src){const m=c.el.querySelector('.md');if(m)m.hidden=true;c.t.hidden=false;c.t.focus()}
  save();return c;
}

async function exec(c){
  c.el.classList.remove('queued');
  if(abort)return;
  const play=c.el.querySelector('.play'),dur=c.el.querySelector('.dur');
  c.el.classList.add('run');c.el.classList.remove('fail');
  play.textContent='■';play.title='Interrupt';
  clearOut(c);
  const t0=performance.now();
  const tick=setInterval(()=>dur.textContent=fmt((performance.now()-t0)/1000),100);
  try{
    if(!rt)throw new Error('Not connected. Use Connect to attach a runtime.');
    const r=await rt.run(c.src,(t,x)=>put(c,t,x));
    c.n=r.n;
    c.el.querySelector('.n').textContent=r.n?'['+r.n+']':'';
    c.el.classList.toggle('fail',!r.ok);
    if(!r.ok&&all)abort=true;
  }catch(e){put(c,'error',String(e.message||e));c.el.classList.add('fail')}
  finally{
    clearInterval(tick);
    c.dur=(performance.now()-t0)/1000;dur.textContent=fmt(c.dur);
    c.el.classList.remove('run');play.textContent='▶';play.title='Run (Shift+Enter)';
    save();
  }
}
const run=c=>{if(c.type!='code')return;c.el.classList.add('queued');q=q.then(()=>exec(c)).catch(()=>{})};
async function runAll(){abort=false;all=true;for(const c of cells)run(c);await q;all=false;abort=false}
async function intr(){
  abort=true;
  try{await rt.interrupt()}catch(e){}
  q=q.then(()=>{abort=false;cells.forEach(c=>c.el.classList.remove('queued'))});
}
async function restart(){
  if(!rt)return;
  await rt.restart();
  cells.forEach(c=>{c.n=0;const n=c.el.querySelector('.n');if(n)n.textContent=''});
}

/* ---------- Connection ---------- */
function setConn(){
  const b=$('#conn');
  if(rt&&info){
    const i=info;
    b.innerHTML=`<i class=dot></i>Connected · ${i.gpus&&i.gpus.length?(i.gpus.length>1?i.gpus.length+'× ':'')+esc(i.gpus[0].name):i.cpu_count+' CPU'}`;
    b.title=`${rt.base}\nRAM ${i.ram_gb} GB · ${i.cpu_count} cores${(i.gpus||[]).map(g=>'\n#'+g.index+' '+g.name+' '+g.memory).join('')}`;
  }else{b.textContent='Connect'}
}
async function connect(url,token){
  const r=new Runtime(url,token);
  await r.wait();
  await r.kernel();
  info=await r.hw();rt=r;
  localStorage.alyx_conn=JSON.stringify({url:r.base,token:r.token,kid:r.kid});
  setConn();
}
async function conn(){
  $('#err').textContent='Connecting…';
  try{await connect($('#cu').value.trim(),$('#ct').value);$('#err').textContent='';$('#dlg').close();ls('')}
  catch(e){$('#err').textContent=e.message}
}

/* ---------- Files ---------- */
async function ls(p){
  cwd=p;if($('#files').hidden||!rt)return;
  let h;
  try{
    const items=(await rt.files(p)).content;
    items.sort((a,b)=>(a.type!='directory')-(b.type!='directory')||a.name.toLowerCase().localeCompare(b.name.toLowerCase()));
    h=items.map(f=>`<li data-p="${esc(f.path)}" data-t="${f.type}">${f.type=='directory'?'📁':'📄'} ${esc(f.name)}</li>`).join('');
  }catch(e){h=esc(e.message)}
  $('#fl').innerHTML=(p?`<li data-p="${esc(p.split('/').slice(0,-1).join('/'))}" data-t=directory>⬑ ..</li>`:'')+h;
}
$('#fl').onclick=async e=>{
  const li=e.target.closest('li');if(!li)return;
  const p=li.dataset.p;
  if(li.dataset.t=='directory')return ls(p);
  const a=document.createElement('a');
  a.href=URL.createObjectURL(await rt.download(p));a.download=p.split('/').pop();a.click();
};
$('#up').onchange=async e=>{
  for(const f of e.target.files)await rt.upload((cwd?cwd+'/':'')+f.name,f);
  ls(cwd);
};

/* ---------- Import / export ---------- */
const file=(n,t)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t]));a.download=n;a.click()};
const nm=()=>$('#title').value.replace(/\.(ipynb|py)$/,'');
function dl(){
  file(nm()+'.ipynb',JSON.stringify({nbformat:4,nbformat_minor:5,metadata:{kernelspec:{name:'python3',display_name:'Python 3'}},
    cells:cells.map(c=>c.type=='code'?{cell_type:'code',metadata:{},execution_count:c.n||null,source:c.src,
      outputs:c.outs.map(o=>o.t=='stdout'||o.t=='stderr'?{output_type:'stream',name:o.t,text:o.x}
        :o.t=='img'?{output_type:'display_data',metadata:{},data:{['image/'+mime(o.x)]:o.x}}
        :o.t=='result'?{output_type:'execute_result',execution_count:c.n||null,metadata:{},data:{'text/plain':o.x}}
        :{output_type:'error',ename:'Error',evalue:'',traceback:[o.x]})}:{cell_type:'markdown',metadata:{},source:c.src})},null,1));
}
const dlpy=()=>file(nm()+'.py',cells.filter(c=>c.type=='code').map(c=>c.src).join('\n\n'));
$('#of').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  const nb=JSON.parse(await f.text());
  cells=[];$('#title').value=f.name;
  nb.cells.forEach(c=>{
    const s=Array.isArray(c.source)?c.source.join(''):c.source;
    if(c.cell_type=='code'||c.cell_type=='markdown')cells.push(mk({type:c.cell_type=='code'?'code':'text',src:s,outs:[],n:0}));
  });
  render();cells.forEach(c=>fit(c.t));save();
};

/* ---------- Boot ---------- */
(async()=>{
  let s=null;
  try{s=localStorage.alyx_nb?JSON.parse(localStorage.alyx_nb):null}catch(e){}
  if(s){$('#title').value=s.t;s.c.forEach(c=>cells.push(mk({type:c.type,src:c.src,outs:c.outs||[],n:c.n||0,dur:c.dur})));render()}
  else add('code','!nvidia-smi');
  if(!cells.length)add('code');
  cells.forEach(c=>fit(c.t));

  // connection source: ?url=…&token=… in this page's URL, else the last saved one
  const qs=new URLSearchParams(location.search);
  let sc=null;try{sc=JSON.parse(localStorage.alyx_conn||'null')}catch(e){}
  const url=qs.get('url')||(sc&&sc.url),token=qs.get('token')||(sc&&sc.token);
  if(url){
    $('#cu').value=url;
    try{await connect(url,token);if(sc&&sc.kid&&!qs.get('url'))rt.kid=sc.kid;ls('');return}
    catch(e){$('#err').textContent=e.message}
  }
  $('#dlg').showModal();
})();
</script>
